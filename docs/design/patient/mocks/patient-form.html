<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>患者登録・編集 — モック v0.3</title>
<style>
:root{--ink:#212529;--muted:#495057;--line:#adb5bd;--panel:#e9ecef;--blue:#0b5ed7;--red:#b02a37}
*{box-sizing:border-box}body{margin:0;background:#f1f3f5;color:var(--ink);font:14px/1.5 "Yu Gothic UI",Meiryo,system-ui,sans-serif}button,input,select{font:inherit}button{min-height:34px;min-width:80px;padding:5px 16px;border:1px solid #9aa3ac;border-radius:3px;background:#e9ecef;color:var(--ink);cursor:pointer}button:hover{background:#dce0e4}button:focus-visible,input:focus,select:focus{outline:2px solid var(--blue);outline-offset:2px}button.primary{background:var(--blue);border-color:var(--blue);color:white}button.primary:hover{background:#084bac}.icon{display:inline-block;margin-right:6px}button[disabled]{opacity:.6;cursor:default}
.app-head{height:44px;border-bottom:1px solid var(--line);background:#e2e6ea;padding:10px 20px;display:flex;align-items:center;gap:24px}.app-head strong{font-size:16px}.app-head span{color:var(--muted)}.host{margin:24px;max-width:920px}.host h1{font-size:18px;margin:0 0 12px}.toolbar{display:flex;gap:8px}.review{border-top:1px solid var(--line);margin-top:20px;padding-top:10px;color:var(--muted);font-size:13px}.review p{margin:4px 0}.host-message{margin-top:16px;border-left:3px solid #26713c;padding:8px 12px;background:white}
dialog{padding:0;width:760px;max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);border:1px solid #7b858f;border-radius:3px;box-shadow:0 6px 20px #0003;color:var(--ink)}dialog::backdrop{background:#29323b66}.dialog-head{padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.dialog-head h2{font-size:17px;margin:0}.mode{font-size:12px;border:1px solid #8a949e;padding:1px 8px;background:white}.body{padding:12px 16px 16px}.identity{display:flex;gap:24px;align-items:center;padding:0 0 10px;border-bottom:1px solid #ced4da;margin-bottom:12px}.identity strong{font-weight:600}.identity .muted{color:var(--muted)}.section{font-size:13px;background:var(--panel);border-left:3px solid #6c757d;padding:4px 8px;margin:0 0 12px;font-weight:600}.fields{display:grid;grid-template-columns:1fr 1fr;column-gap:24px;row-gap:10px}.field{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:start;gap:8px}.field label{padding-top:7px;white-space:nowrap}.req{color:var(--red);margin-left:3px}.control input,.control select{display:block;width:100%;height:35px;min-width:0;border:1px solid var(--line);border-radius:2px;padding:5px 8px;background:white;color:var(--ink)}.field-error{margin:3px 0 0;color:var(--red);font-size:12px}.control [aria-invalid=true]{border-color:var(--red)}.form-message{padding:7px 10px;margin:0 0 12px;border-left:3px solid var(--red);background:#fceff0}.dialog-foot{border-top:1px solid var(--line);background:#f8f9fa;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.footnote{font-size:12px;color:var(--muted)}.buttons{display:flex;gap:8px}.discard{border:1px solid #c3a875;background:#fff8e8;padding:12px;margin-top:16px}.discard p{margin:0 0 10px}.discard .buttons{justify-content:flex-end}[hidden]{display:none!important}
@media(max-width:560px){.fields{grid-template-columns:1fr}.field{grid-template-columns:80px minmax(0,1fr)}.dialog-foot{align-items:flex-end}.identity{gap:12px}.app-head span{display:none}.host{margin:16px}}
</style>
</head>
<body>
<header class="app-head"><strong>外来業務</strong><span>患者管理</span></header>
<main class="host">
<h1>患者画面 呼び出し確認</h1>
<div class="toolbar"><button id="new" type="button">新規</button><button id="edit" type="button">編集</button></div>
<div id="host-message" class="host-message" role="status" hidden></div>
<div class="review"><p>設計モック v0.3（設計追補v0.4反映） / 架空データ限定 / DB保存・API通信なし</p><p>「新規」「編集」で同じフォームを開きます。この呼び出し元は動作確認用で、患者一覧は別Issueです。</p><p>患者番号は内部IDとは別の表示Noです。初回は同じ番号を設定します。姓名4項目は必須、生年月日・性別は未入力を許容します。</p></div>
</main>
<dialog id="patient-dialog" aria-labelledby="dialog-title">
<div class="dialog-head"><h2 id="dialog-title">患者登録</h2><span class="mode" id="mode">新規</span></div>
<form id="patient-form" novalidate>
<div class="body">
<div class="identity"><span>患者番号　<strong id="patient-number">自動発行</strong></span><span class="muted">基本情報</span></div>
<div id="form-message" class="form-message" role="alert" hidden></div>
<p class="section">患者情報</p>
<div class="fields">
 <div class="field"><label for="last-name">姓<span class="req" aria-label="必須">＊</span></label><div class="control"><input id="last-name" name="last_name" required maxlength="100" autocomplete="off" aria-describedby="last-name-error"><p id="last-name-error" class="field-error" hidden></p></div></div>
 <div class="field"><label for="first-name">名<span class="req" aria-label="必須">＊</span></label><div class="control"><input id="first-name" name="first_name" required maxlength="100" autocomplete="off" aria-describedby="first-name-error"><p id="first-name-error" class="field-error" hidden></p></div></div>
 <div class="field"><label for="last-kana">セイ<span class="req" aria-label="必須">＊</span></label><div class="control"><input id="last-kana" name="last_name_kana" required maxlength="100" autocomplete="off" aria-describedby="last-kana-error"><p id="last-kana-error" class="field-error" hidden></p></div></div>
 <div class="field"><label for="first-kana">メイ<span class="req" aria-label="必須">＊</span></label><div class="control"><input id="first-kana" name="first_name_kana" required maxlength="100" autocomplete="off" aria-describedby="first-kana-error"><p id="first-kana-error" class="field-error" hidden></p></div></div>
 <div class="field"><label for="birth-date">生年月日</label><div class="control"><input id="birth-date" name="birth_date" type="date" aria-describedby="birth-date-error"><p id="birth-date-error" class="field-error" hidden></p></div></div>
 <div class="field"><label for="sex">性別</label><div class="control"><select id="sex" name="sex"><option value="">未設定</option><option value="male">男性</option><option value="female">女性</option><option value="other">その他</option></select></div></div>
</div>
<section id="discard" class="discard" role="alert" hidden><p><span class="icon" aria-hidden="true">⚠</span>入力中の変更を破棄して閉じますか？</p><div class="buttons"><button id="resume" type="button">戻る</button><button id="discard-close" type="button"><span class="icon" aria-hidden="true">⚠</span>中止</button></div></section>
</div>
<div class="dialog-foot"><span class="footnote">＊ 必須項目</span><div class="buttons"><button id="register" class="primary" type="submit">登録</button><button id="close" type="button">閉じる</button></div></div>
</form>
</dialog>
<script>
const dialog=document.getElementById('patient-dialog'), form=document.getElementById('patient-form');
const controls=[...form.querySelectorAll('input,select')];
const discard=document.getElementById('discard'), message=document.getElementById('form-message');
let original='', opener=document.getElementById('new');
const values=()=>JSON.stringify(controls.map(el=>el.value));
function clearErrors(){message.hidden=true;form.querySelectorAll('.field-error').forEach(el=>{el.hidden=true;el.textContent=''});controls.forEach(el=>el.removeAttribute('aria-invalid'))}
function openForm(edit=false){opener=document.activeElement;form.reset();clearErrors();discard.hidden=true;document.getElementById('register').disabled=false;document.getElementById('dialog-title').textContent=edit?'患者編集':'患者登録';document.getElementById('mode').textContent=edit?'編集':'新規';document.getElementById('patient-number').textContent=edit?'123（架空）':'自動発行';if(edit){['デモ患者','一郎','デモカンジャ','イチロウ','1990-01-01','male'].forEach((v,i)=>controls[i].value=v)}original=values();dialog.showModal();controls[0].focus()}
function finish(){dialog.close();if(opener && opener.focus)opener.focus()}
function requestClose(){if(values()!==original){discard.hidden=false;document.getElementById('register').disabled=true;document.getElementById('resume').focus()}else finish()}
document.getElementById('new').addEventListener('click',()=>openForm());document.getElementById('edit').addEventListener('click',()=>openForm(true));
document.getElementById('close').addEventListener('click',requestClose);dialog.addEventListener('cancel',e=>{e.preventDefault();requestClose()});
dialog.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const items=[...dialog.querySelectorAll('input,select,button')].filter(el=>!el.disabled&&el.getClientRects().length);const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
document.getElementById('resume').addEventListener('click',()=>{discard.hidden=true;document.getElementById('register').disabled=false;controls[0].focus()});document.getElementById('discard-close').addEventListener('click',finish);
form.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')e.preventDefault()});
form.addEventListener('submit',e=>{e.preventDefault();clearErrors();let invalid=[];const now=new Date();const today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');for(const el of controls){let reason='';if(el.required&&!el.value.trim())reason='入力してください。';else if(el.type==='date'&&el.value>today)reason='未来日は指定できません。';if(reason){el.setAttribute('aria-invalid','true');const error=document.getElementById(el.id+'-error');error.textContent=reason;error.hidden=false;invalid.push(el)}}if(invalid.length){message.textContent='入力内容を確認してください。';message.hidden=false;invalid[0].focus();return}document.getElementById('host-message').hidden=false;document.getElementById('host-message').textContent='モック：登録成功後に閉じ、呼び出し元へ戻る動作を確認しました。データは保存していません。';finish()});
document.getElementById('new').focus();openForm();
</script>
</body>
</html>
