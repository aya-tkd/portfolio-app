<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>職種登録・編集 — 設計モック v0.2</title>
<style>
:root{--ink:#212529;--line:#adb5bd;--panel:#e9ecef;--blue:#0b5ed7;--red:#b02a37}*{box-sizing:border-box}body{margin:0;background:#f1f3f5;color:var(--ink);font:14px/1.5 "Yu Gothic UI",Meiryo,sans-serif}button,input,select{font:inherit}button{min-height:34px;min-width:80px;padding:5px 16px;border:1px solid #9aa3ac;border-radius:3px;background:#e9ecef;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.app-head{height:44px;padding:10px 20px;background:#e2e6ea;border-bottom:1px solid var(--line)}.host{max-width:920px;margin:24px}.toolbar,.buttons{display:flex;gap:8px}.notice,.review{margin-top:16px;padding:8px 12px;background:#fff;border-left:3px solid #26713c}.review{border-left:0;border-top:1px solid var(--line);background:transparent;color:#495057;font-size:12px}dialog{width:640px;max-width:calc(100vw - 24px);padding:0;border:1px solid #7b858f;border-radius:3px;box-shadow:0 6px 20px #0003}.dialog-head,.dialog-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:17px}.dialog-body{padding:12px 16px 16px}.identity{padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid #ced4da}.identity span{margin-left:16px;color:#495057}.section{padding:4px 8px;margin:0 0 12px;background:var(--panel);border-left:3px solid #6c757d;font-weight:600}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;border:0;padding:0}.field{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px}.wide{grid-column:1/-1}.field label{padding-top:7px}.req{color:var(--red)}input,select{width:100%;height:35px;padding:5px 8px;border:1px solid var(--line);border-radius:2px}.dialog-foot{border-top:1px solid var(--line);border-bottom:0;background:#f8f9fa}.dialog-foot span{font-size:12px;color:#495057}.discard{margin-top:16px;padding:12px;background:#fff8e8;border:1px solid #c3a875}.discard .buttons{justify-content:flex-end}[hidden]{display:none!important}@media(max-width:560px){.fields{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
</head>
<body>
<header class="app-head"><strong>外来業務</strong>　システム管理</header>
<main class="host"><h1>職種マスタ</h1><div class="toolbar"><button id="new" type="button">新規</button><button id="edit" type="button">編集（表示例）</button></div><p id="notice" class="notice" hidden></p><div class="review">設計モック v0.2 / 配置・操作確認用 / 架空の表示例のみ。実装後は Vue → Rails API → SQLite → JSON応答 → 完了通知の順に処理します。このモック自体はDBへ接続しません。</div></main>
<dialog id="occupation-dialog" aria-labelledby="dialog-title"><header class="dialog-head"><h2 id="dialog-title">職種登録</h2><span id="mode">新規</span></header><form id="occupation-form" novalidate><div class="dialog-body"><div class="identity">職種ID　<strong id="occupation-id">自動採番（保存時）</strong><span>基本情報</span></div><p class="section">職種情報</p><fieldset class="fields"><div class="field wide"><label for="name">職種名<span class="req">＊</span></label><input id="name" required maxlength="100"></div><div class="field"><label for="order">表示順<span class="req">＊</span></label><input id="order" type="number" min="1" value="1" required></div><div class="field"><label for="active">利用状態<span class="req">＊</span></label><select id="active"><option>有効</option><option>無効</option></select></div></fieldset><section id="discard" class="discard" hidden><p>⚠ 入力中の変更を破棄して閉じますか？</p><div class="buttons"><button id="resume" type="button">戻る</button><button id="cancel" type="button">⚠ 中止</button></div></section></div><footer class="dialog-foot"><span>＊ 必須項目</span><div class="buttons"><button class="primary" type="submit">登録</button><button id="close" type="button">閉じる</button></div></footer></form></dialog>
<script>
const dialog=document.querySelector('#occupation-dialog'),form=document.querySelector('#occupation-form'),inputs=[...form.querySelectorAll('input,select')];let original='',opener=document.querySelector('#new');const snapshot=()=>JSON.stringify(inputs.map(input=>input.value));
function open(edit){opener=document.activeElement;form.reset();document.querySelector('#dialog-title').textContent=edit?'職種編集':'職種登録';document.querySelector('#mode').textContent=edit?'編集':'新規';document.querySelector('#occupation-id').textContent=edit?'1（表示例）':'自動採番（保存時）';document.querySelector('#order').value=edit?'10':'1';if(edit)document.querySelector('#name').value='医師';original=snapshot();document.querySelector('#discard').hidden=true;dialog.showModal();document.querySelector('#name').focus()}
function finish(){dialog.close();opener?.focus()}function requestClose(){if(snapshot()!==original){document.querySelector('#discard').hidden=false;document.querySelector('#resume').focus()}else finish()}
document.querySelector('#new').onclick=()=>open(false);document.querySelector('#edit').onclick=()=>open(true);document.querySelector('#close').onclick=requestClose;dialog.addEventListener('cancel',event=>{event.preventDefault();requestClose()});document.querySelector('#resume').onclick=()=>{document.querySelector('#discard').hidden=true;document.querySelector('#name').focus()};document.querySelector('#cancel').onclick=finish;dialog.addEventListener('keydown',event=>{if(event.key!=='Tab')return;const items=[...dialog.querySelectorAll('input,select,button')].filter(element=>!element.disabled&&element.getClientRects().length);const first=items[0],last=items.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}});form.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.tagName==='INPUT')event.preventDefault()});form.onsubmit=event=>{event.preventDefault();if(!form.reportValidity())return;document.querySelector('#notice').textContent='モック：実装後は保存結果の職種IDと名称を受け取り、ここへ完了通知を表示します。';document.querySelector('#notice').hidden=false;finish()};open(false);
</script>
</body>
</html>
