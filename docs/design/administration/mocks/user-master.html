<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>ユーザーマスタ（承認済みモック）</title><style>body{margin:0;background:#eef1f4;font:14px system-ui;color:#26323d}.dialog{margin:28px auto;width:min(1100px,94vw);height:650px;background:#fff;border:1px solid #8795a1;display:grid;grid-template-columns:220px 1fr}.nav{padding:16px;background:#f8f9fa;border-right:1px solid #adb5bd}.nav b,.nav span{display:block;margin:8px}.nav span{font-size:11px;color:#59636e;margin-top:20px}.nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px}.nav button.active{background:#e2e8ef;border-left:3px solid #45647f;font-weight:700}.main{padding:18px;display:flex;flex-direction:column;gap:12px}.title{display:flex;justify-content:space-between}.title h1{font-size:18px;margin:0}.search,.result,footer{border:1px solid #adb5bd;background:#fff}.search{padding:12px;display:flex;gap:12px;align-items:end}.search label{display:grid;gap:4px}.search input,.search select{height:30px;min-width:130px}.result{flex:1}.result header,footer{background:#e9ecef;padding:9px 12px;border:0;border-bottom:1px solid #adb5bd;display:flex;justify-content:space-between}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #dce1e5;text-align:left}th{background:#f4f6f8}.selected{background:#e7f1fb}footer{border-top:1px solid #adb5bd;margin-top:auto}button{padding:7px 16px;border:1px solid #768899;background:#fff}</style></head><body><main class="dialog"><nav class="nav"><b>マスタ設定</b><span>患者情報</span><button>患者マスタ</button><span>診療所のマスタ</span><button>診療科マスタ</button><button>職種マスタ</button><span>利用者・職員</span><button class="active">ユーザーマスタ</button></nav><section class="main"><header class="title"><h1>ユーザーマスタ</h1><small>スタッフ基本情報を検索・登録・編集します。</small></header><section class="search"><label>ユーザーID<input></label><label>氏名・カナ氏名<input></label><label>診療科<select><option>すべて</option><option>内科</option></select></label><label>職種<select><option>すべて</option><option>医師</optio <link rel="stylesheet" href="../../../../frontend/src/shared/styles/style.css">
<style>.mock-form{max-width:840px;height:630px;margin:28px auto;box-sizing:border-box}.mock-form *{box-sizing:border-box}.mock-form fieldset{border:0;padding:0;margin:0}.mock-form .form-control,.mock-form .form-select{width:100%;background:#fff}.mock-form .btn-primary{background:#0b5ed7;color:#fff}.mock-form .btn-secondary{background:#e9ecef;color:#212529}.mock-form .dialog-foot{margin:0;border-bottom:0}.mock-form .dialog-head{padding:10px 16px}</style>
<section class="master-form mock-form" aria-label="ユーザー登録モック">
<header class="dialog-head"><h2>ユーザー登録</h2><span class="mode">新規</span></header>
<form onsubmit="return false"><div class="dialog-body">
<div class="identity">ユーザーID <strong>自動採番（保存時）</strong><span>基本情報</span></div>
<p class="section-heading">ユーザー情報</p><fieldset class="fields">
<div class="field"><label>姓<span class="required">＊</span></label><div><input class="form-control" aria-label="姓"></div></div>
<div class="field"><label>名<span class="required">＊</span></label><div><input class="form-control" aria-label="名"></div></div>
<div class="field"><label>セイ<span class="required">＊</span></label><div><input class="form-control" aria-label="セイ"></div></div>
<div class="field"><label>メイ<span class="required">＊</span></label><div><input class="form-control" aria-label="メイ"></div></div>
<div class="field"><label>診療科</label><div><select class="form-select" aria-label="診療科"><option>未設定</option><option>架空内科</option></select></div></div>
<div class="field"><label>職種</label><div><select class="form-select" aria-label="職種"><option>未設定</option><option>架空職種</option></select></div></div>
<div class="field"><label>利用状態<span class="required">＊</span></label><div><select class="form-select" aria-label="利用状態"><option>有効</option><option>無効</option></select></div></div>
</fieldset></div><footer class="dialog-foot"><span>＊ 必須項目</span><div class="buttons"><button type="button" class="btn btn-primary">登録</button><button type="button" class="btn btn-secondary">閉じる</button></div></footer></form></section>
