<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マスタ設定ワークスペース モック</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#edf0f2;color:#212529;font:14px/1.45 system-ui,"Yu Gothic UI",sans-serif}.overlay{min-height:100vh;padding:24px;background:#29323b80;display:grid;place-items:center}.dialog{width:min(1180px,100%);height:min(760px,calc(100vh - 48px));display:flex;flex-direction:column;overflow:hidden;background:#f1f3f5;border:1px solid #7b858f;box-shadow:0 8px 24px #0004}.dialog-head{height:44px;display:flex;align-items:center;gap:24px;padding:0 20px;background:#e2e6ea;border-bottom:1px solid #adb5bd}.workspace{min-height:0;flex:1;display:grid;grid-template-columns:220px 1fr}.nav{padding:16px 10px;background:#f8f9fa;border-right:1px solid #adb5bd;display:flex;flex-direction:column;gap:6px}.nav strong,.nav span{padding:0 8px}.nav span{margin-top:10px;font-size:11px;color:#59636e}.nav button{text-align:left;min-height:42px;border:1px solid transparent;background:transparent;padding:8px 10px;font:inherit}.nav button.active{background:#e2e8ef;border-color:#bcc7d2;box-shadow:inset 3px 0 #45647f;font-weight:700}.nav button:disabled{opacity:.58}.main{min-width:0;min-height:0;padding:18px;display:flex;flex-direction:column;gap:12px}.title{display:flex;justify-content:space-between;align-items:baseline}.title h1{margin:0;font-size:18px}.title span{font-size:12px;color:#59636e}.list,.form{min-height:0;flex:1;display:flex;flex-direction:column;gap:12px}.conditions,.results,.form{background:#fff;border:1px solid #adb5bd}.conditions{padding:13px}.conditions label{display:inline-grid;gap:4px;margin-right:14px}.conditions input,.conditions select{height:34px;min-width:180px;border:1px solid #adb5bd}.results{min-height:0;flex:1;display:flex;flex-direction:column}.results header,.foot{display:flex;justify-content:space-between;padding:9px 12px;background:#e9ecef;border-bottom:1px solid #adb5bd}.grid{overflow:auto;flex:1}.grid table{width:100%;border-collapse:collapse}.grid th,.grid td{padding:9px;border-bottom:1px solid #dce1e5;text-align:left}.grid th{position:sticky;top:0;background:#f4f6f8}.grid tr.selected{background:#e7f1fb}.foot{margin-top:auto;border:1px solid #adb5bd;border-bottom:0;background:#f1f3f5}.btn{min-width:88px;height:34px;margin-left:8px;border:1px solid #8d9aa7;border-radius:3px;background:#f8f9fa;font:inherit}.primary{background:#0b5ed7;color:#fff;border-color:#0a58ca}.form{padding:18px;overflow:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}.field{display:grid;gap:4px}.field input{height:34px;border:1px solid #adb5bd}.hidden{display:none}@media(max-width:760px){.overlay{padding:12px}.dialog{height:calc(100vh - 24px)}.workspace{grid-template-columns:155px 1fr}.main{padding:12px}.conditions label{display:grid;margin-bottom:8px}.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-label="外来業務 マスタ設定">
    <header class="dialog-head"><strong>外来業務</strong><span>マスタ設定</span></header>
    <div class="workspace"><nav class="nav" aria-label="設定するマスタ"><strong>マスタ設定</strong><span>患者情報</span><button data-master="patient">患者マスタ</button><span>業務マスタ</span><button class="active" data-master="department">診療科マスタ</button><button data-master="occupation">職種マスタ</button><span>利用者・権限</span><button disabled>ユーザーマスタ　準備中</button></nav>
      <section class="main"><header class="title"><h1 id="title">診療科マスタ</h1><span id="caption">診療科を検索し、登録・編集します。</span></header>
        <section id="list" class="list"><section class="conditions"><label><span id="keyword-label">診療科名・カナ名</span><input placeholder="部分一致で検索"></label><label id="active-field">利用状態<select><option>すべて</option><option>利用中</option><option>停止中</option></select></label><button class="btn">検索</button></section><section class="results"><header><strong>検索結果</strong><span id="count">3件</span></header><div class="grid"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></section><footer class="foot"><span>行を選択してから「編集」を押します。</span><div><button id="new" class="btn">新規</button><button id="edit" class="btn" disabled>編集</button><button class="btn">閉じる</button></div></footer></section>
        <section id="form" class="form hidden"><h2 id="form-title">診療科マスタ 新規登録</h2><p>登録または閉じるで、選択中のマスタ一覧へ戻ります。</p><div id="fields" class="form-grid"></div><footer class="foot"><span>保存時は一覧を再検索します。</span><div><button id="save" class="btn primary">登録</button><button id="back" class="btn">閉じる</button></div></footer></section>
      </section></div>
  </section></main>
  <script>
    const masters={patient:{name:'患者マスタ',caption:'患者を検索し、登録・編集します。',key:'患者番号・氏名・カナ氏名',cols:['患者番号','氏名','カナ氏名','生年月日','性別'],rows:[['1001','山田 太郎','ヤマダ タロウ','1985-04-12','男性']],fields:['姓','名','セイ','メイ','生年月日','性別']},department:{name:'診療科マスタ',caption:'診療科を検索し、登録・編集します。',key:'診療科名・カナ名',cols:['ID','診療科名','カナ名','略名','表示順','利用状態'],rows:[[1,'内科','ナイカ','内科',1,'利用中'],[2,'整形外科','セイケイゲカ','整形',2,'利用中'],[3,'放射線科','ホウシャセンカ','放射線',3,'停止中']],fields:['診療科名','カナ名','略名','表示順','利用状態']},occupation:{name:'職種マスタ',caption:'職種を検索し、登録・編集します。',key:'職種名',cols:['ID','職種名','表示順','利用状態'],rows:[[1,'医師',1,'利用中'],[2,'看護師',2,'利用中']],fields:['職種名','表示順','利用状態']}};let current='department',selected=null;const $=id=>document.getElementById(id);function render(){const m=masters[current];$('title').textContent=m.name;$('caption').textContent=m.caption;$('keyword-label').textContent=m.key;$('active-field').style.display=current==='patient'?'none':'inline-grid';$('head').innerHTML='<tr>'+m.cols.map(x=>'<th>'+x+'</th>').join('')+'</tr>';$('body').innerHTML=m.rows.map((row,i)=>'<tr data-index='+i+'>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('');$('count').textContent=m.rows.length+'件';selected=null;$('edit').disabled=true;document.querySelectorAll('[data-master]').forEach(button=>button.classList.toggle('active',button.dataset.master===current));document.querySelectorAll('#body tr').forEach(row=>row.onclick=()=>{selected=Number(row.dataset.index);document.querySelectorAll('#body tr').forEach(x=>x.classList.remove('selected'));row.classList.add('selected');$('edit').disabled=false})}function openForm(edit){const m=masters[current];$('list').classList.add('hidden');$('form').classList.remove('hidden');$('form-title').textContent=m.name+(edit?' 編集':' 新規登録');$('fields').innerHTML=m.fields.map(x=>'<label class="field">'+x+'<input></label>').join('')}document.querySelectorAll('[data-master]').forEach(button=>button.onclick=()=>{current=button.dataset.master;render()});$('new').onclick=()=>openForm(false);$('edit').onclick=()=>openForm(true);$('save').onclick=$('back').onclick=()=>{$('form').classList.add('hidden');$('list').classList.remove('hidden')};render();
  </script>
</body>
</html>
