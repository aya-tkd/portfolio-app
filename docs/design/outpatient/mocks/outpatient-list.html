<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外来一覧 — モック v0.2</title>
<style>
:root{font:14px/1.5 "Yu Gothic UI",Meiryo,sans-serif;color:#212529;background:#f1f3f5}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;color:#68727d}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #0b5ed7;outline-offset:2px}.top{height:54px;background:#e2e6ea;border-bottom:1px solid #adb5bd;display:flex;align-items:center;gap:24px;padding:0 18px}.brand{font-size:15px;font-weight:700}.top h1{font-size:18px;margin:0;padding-left:24px;border-left:1px solid #adb5bd}.layout{display:grid;grid-template-columns:164px minmax(0,1fr);height:calc(100dvh - 54px)}aside{display:flex;flex-direction:column;gap:6px;background:#f8f9fa;border-right:1px solid #adb5bd;padding:16px 10px}.group{font-size:11px;font-weight:700;color:#59636e;margin:0 8px 4px}.nav{display:flex;align-items:center;gap:9px;min-height:42px;width:100%;padding:9px 8px;background:transparent;color:inherit;text-decoration:none;text-align:left;border:1px solid transparent;border-radius:3px}.nav.active{background:#e2e8ef;border-color:#bcc7d2;box-shadow:inset 3px 0 #45647f;font-weight:700}.nav small{margin-left:auto;font-size:10px}.nav svg{width:19px;height:19px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.admin{margin-top:auto;padding-top:16px;border-top:1px solid #ced4da}main{min-width:0;min-height:0;padding:16px;display:flex;flex-direction:column;gap:12px}.conditions{background:#fff;border:1px solid #adb5bd;padding:12px 14px}.fields{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px}.field{display:flex;align-items:center;gap:8px}.field input,.field select{height:34px;border:1px solid #adb5bd;border-radius:2px;padding:4px 8px;background:white}.field select{min-width:140px}.btn{border:1px solid #9aa3ac;border-radius:3px;background:#e9ecef;min-height:34px;padding:5px 15px}.search{margin-left:auto}.progress{border:0;border-top:1px solid #dee2e6;margin:12px 0 0;padding:10px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.progress legend{float:left;padding:5px 12px 0 0}.check{display:flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid #ced4da;border-radius:2px;background:#f8f9fa;cursor:pointer}.check:has(:checked){border-color:#8a9fb2;background:#edf2f6}.check input{width:15px;height:15px;margin:0;accent-color:#45647f}.minor{background:transparent;border:0;text-decoration:underline;color:#495057;font-size:12px;padding:5px}.results{min-height:0;flex:1;display:flex;flex-direction:column;border:1px solid #adb5bd;background:white}.result-head{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#e9ecef;padding:8px 12px;border-bottom:1px solid #adb5bd}.result-head h2{font-size:14px;margin:0}.result-head span{font-size:12px;color:#495057}.scroll{overflow:auto;flex:1;min-height:160px}table{border-spacing:0;width:100%;min-width:1120px;font-size:13px}th,td{padding:10px 9px;text-align:left;border-bottom:1px solid #dce1e5;white-space:nowrap}th{position:sticky;top:0;background:#f4f6f8;z-index:1;border-bottom:1px solid #adb5bd}tbody tr:nth-child(even){background:#fafbfc}tbody tr:hover{background:#f0f4f8}.num{font-variant-numeric:tabular-nums}.patient{font-weight:600}.tag{display:inline-block;min-width:66px;border:1px solid #bdc5cd;border-radius:2px;padding:2px 7px;font-size:12px;background:#f3f4f5}.tag.received{border-color:#8fa5ba;background:#edf3f9;color:#264963}.tag.consulting{border-color:#baaa7b;background:#faf5e7;color:#665014}.tag.consulted{border-color:#9eafa3;background:#eff5f0;color:#39553e}.tag.paid{color:#59616a;background:#f0f1f2}.muted{color:#68727d}.equipment{white-space:normal;min-width:130px}.foot{display:flex;justify-content:space-between;gap:12px;padding:7px 12px;border-top:1px solid #adb5bd;font-size:12px;color:#495057}.empty{padding:28px;text-align:center;color:#495057}.review{font-size:12px;color:#59636e}.review summary{cursor:pointer}.review p{margin:6px 0}[hidden]{display:none!important}@media(max-width:800px){.layout{grid-template-columns:138px minmax(0,1fr)}main{padding:10px}.top{gap:12px}.top h1{padding-left:12px}.brand{font-size:13px}.search{margin-left:0}.nav{padding:8px 5px;gap:6px}.field select{min-width:110px}}
.nav{white-space:nowrap;gap:7px;padding-left:6px;padding-right:6px}.nav small{font-size:9px}.layout{grid-template-columns:180px minmax(0,1fr)}@media(max-width:800px){.layout{grid-template-columns:164px minmax(0,1fr)}}
</style></head><body>
<header class="top"><span class="brand">医療機関業務システム</span><h1>外来一覧</h1></header>
<div class="layout"><aside aria-label="業務メニュー"><p class="group">外来業務</p>
<a class="nav active" href="#" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M8 9v11M12 13h6M12 17h6"/></svg>外来一覧</a>
<button class="nav" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v5M17 3v5M3 10h18M7 14h3M14 14h3"/></svg>予約<small>準備中</small></button>
<button class="nav" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M8 13l3 3 5-6"/></svg>受付<small>準備中</small></button>
<button class="nav" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h2M14 11h2M8 15h2M14 15h2M8 19h2M14 19h2"/></svg>会計<small>準備中</small></button>
<div class="admin"><p class="group">管理</p><button class="nav" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="#f8f9fa"/><circle cx="16" cy="12" r="2" fill="#f8f9fa"/><circle cx="10" cy="18" r="2" fill="#f8f9fa"/></svg>マスタ設定<small>準備中</small></button></div></aside>
<main><form class="conditions" id="filters"><div class="fields"><div class="field"><label for="date">診療日</label><input id="date" type="date" value="2026-09-14" required></div><div class="field"><label for="department">診療科</label><select id="department"><option value="">すべて</option><option>内科</option><option>整形外科</option></select></div><button class="btn search" type="submit">検索</button></div>
<fieldset class="progress"><legend>進捗</legend><label class="check"><input type="checkbox" name="progress" value="予約" checked>予約</label><label class="check"><input type="checkbox" name="progress" value="受付済" checked>受付済</label><label class="check"><input type="checkbox" name="progress" value="診察中" checked>診察中</label><label class="check"><input type="checkbox" name="progress" value="診察済" checked>診察済</label><label class="check"><input type="checkbox" name="progress" value="会計済" checked>会計済</label><button class="minor" type="button" id="all">すべて選択</button><button class="minor" type="button" id="clear">選択解除</button></fieldset></form>
<section class="results" aria-labelledby="result-title"><div class="result-head"><h2 id="result-title">外来患者</h2><span id="condition-label"></span></div><div class="scroll" tabindex="0" role="region" aria-label="外来患者一覧（横・縦スクロール可能）"><table><thead><tr><th>進捗</th><th>受付No.</th><th>予約時刻</th><th>受付時刻</th><th>患者No.</th><th>患者氏名</th><th>業務</th><th>診療科</th><th>診察医</th><th>設備予約</th></tr></thead><tbody id="rows"></tbody></table><p class="empty" id="empty" hidden></p></div><div class="foot"><span id="count" role="status" aria-live="polite"></span><span>—：未受付・未予約・対象外 ／ 診察医の未割当：「未定」</span></div></section>
<details class="review"><summary>設計レビュー用メモ · v0.2</summary><p>全件が架空データ。日付・診療科・進捗の検索を試せます。サイドバーは業務画面の切替用です。検査のみの進捗表現、診察医の持ち方は設計案をご確認ください。このメモは製品画面には含めません。</p></details></main></div>
<script>
// 設計用の架空データ。診察と設備は独立した状態を持ち、会計待ちを導出する。
const records=[
 {id:1,name:'山田 太郎',state:'診察中',items:[{name:'CT',done:false},{name:'MRI',done:true}],open:true},
 {id:2,name:'鈴木 花子',state:'受付済',items:[]},
 {id:3,name:'伊藤 明',state:'呼出済',items:[]},
 {id:4,name:'佐藤 一郎',state:'受付済',exam:true,items:[{name:'CT',done:false}]},
 {id:5,name:'田中 健',state:'診察済',items:[{name:'CT',done:false}]},
 {id:6,name:'高橋 美咲',state:'会計済',items:[]},
 {id:7,name:'山田 太郎',state:'予約',items:[{name:'CT',done:false}]}
];
const states=['予約','受付済','呼出済','診察中','設備待ち','実施待ち','会計待ち','会計済'];
document.title='外来一覧 — モック v0.3';
document.querySelector('.review summary').textContent='設計レビュー用メモ · v0.3';
document.querySelector('.review p').textContent='架空データ。設備行の開閉と次の操作を試せます。実施は完了を記録します。再読み込みでリセットされます。';
document.querySelector('#date').value='2026-09-15';
document.querySelector('.progress').innerHTML='<legend>進捗</legend>'+states.map(s=>'<label class="check"><input type="checkbox" name="progress" value="'+s+'" checked>'+s+'</label>').join('');
document.querySelector('thead tr').innerHTML=['進捗','受付No.','予約時刻','受付時刻','患者No.','患者氏名','業務 / 設備','診療科','診察医','次の操作'].map(s=>'<th>'+s+'</th>').join('');
const style=document.createElement('style');style.textContent='.child td{background:#f3f6f9}.child td:nth-child(7){padding-left:26px;border-left:3px solid #bcc7d2}.next{background:#0b5ed7;color:white;border:1px solid #0b5ed7;border-radius:3px;min-height:32px;min-width:88px}.toggle{background:transparent;border:0;color:#334e68}.summary{display:block;font-size:11px;color:#59636e}';document.head.append(style);
let visible=[...records];
function status(r){if(['予約','会計済'].includes(r.state))return r.state;const done=r.items.every(i=>i.done);return r.exam?(done?'会計待ち':'実施待ち'):r.state==='診察済'?(done?'会計待ち':'設備待ち'):r.state}
function btn(text,action,cls='next'){const b=document.createElement('button');b.type='button';b.textContent=text;b.className=cls;b.onclick=action;return b}
function draw(){
 const body=document.querySelector('#rows');body.replaceChildren();
 function append(r,item){
 const tr=document.createElement('tr');tr.dataset.key=item?'item-'+r.id+'-'+item.name:'row-'+r.id;if(item)tr.className='child';
 const reserved=r.state==='予約',equipment=item||(r.exam?r.items[0]:null);
 const values=[item?(reserved?'予約':item.done?'実施済':'実施待ち'):status(r),reserved?'—':String(r.id).padStart(4,'0'),item?'10:00':'09:00',reserved?'—':'08:45',String(1000+r.id),r.name,item?item.name:r.exam?'CT（検査のみ）':'診察','内科',item||r.exam?'—':'青木 一郎',''];
 values.forEach((value,index)=>{const td=document.createElement('td');td.textContent=value;
 if(index===6&&!item&&!r.exam&&r.items.length){const toggle=btn(r.open?'▾':'▸',()=>{r.open=!r.open;draw();document.querySelector('[data-key="row-'+r.id+'"] .toggle').focus()},'toggle');toggle.setAttribute('aria-expanded',String(!!r.open));toggle.setAttribute('aria-label',r.name+'の設備行');td.prepend(toggle);const summary=document.createElement('span');summary.className='summary';summary.textContent='設備 '+r.items.filter(i=>i.done).length+'/'+r.items.length+'件完了';td.append(summary)}
 if(index===9){let label,run;if(equipment&&!equipment.done&&!reserved&&r.state!=='会計済'){label='実施';run=()=>equipment.done=true}else if(!item&&!r.exam){const step={'受付済':['呼出','呼出済'],'呼出済':['診察開始','診察中'],'診察中':['診察終了','診察済']}[r.state];if(step){label=step[0];run=()=>r.state=step[1]}}if(label)td.append(btn(label,()=>{run();draw();const target=document.querySelector('[data-key="'+tr.dataset.key+'"] .next');if(target)target.focus();else document.querySelector('#count').focus();document.querySelector('#count').textContent=r.name+'：'+label+'を記録 / '+visible.length+'受付'}))}
 tr.append(td)});body.append(tr)}
 visible.forEach(r=>{append(r);if(r.open&&!r.exam)r.items.forEach(i=>append(r,i))});
 const count=document.querySelector('#count');count.tabIndex=-1;count.textContent=visible.length+'受付 / 表示'+body.children.length+'行';
 document.querySelector('#empty').hidden=!!visible.length;document.querySelector('#empty').textContent='条件に一致する外来患者はいません。';
}
document.querySelector('#filters').onsubmit=e=>{e.preventDefault();const selected=[...document.querySelectorAll('[name=progress]:checked')].map(i=>i.value);visible=records.filter(r=>document.querySelector('#date').value==='2026-09-15'&&document.querySelector('#department').value!=='整形外科'&&selected.includes(status(r)));draw()};
document.querySelector('#condition-label').textContent='2026/09/15 · 架空データ';
draw();
</script></body></html>
